<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
  <style>
  *{
    padding: 0px;
    margin: 0px;
    border: 0px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: normal;
   
  }
    .contenedor{
      width:  90%;
      margin: 0 auto; /*centrado*/
      background-color:aqua;
      padding: .5rem;
      text-align: center;
  }

  .tarjeta{
    padding: 1rem; /*tamaño <M>*/

    background-color: aliceblue;
    display: inline-block;
    border-radius: 10px;
    margin-bottom: .25rem; /*separacion inferior*/

  }

  .tarjeta a{
    text-decoration: none;
    font-size: 12px;
  }

  a:hover{
    text-decoration: underline;
  }

  .tarjeta h5{
    font-style: italic;
    margin-bottom: .25rem;
  }




  </style>
  <select name="selector-carreras" id="selector-carreras">
    <option value="">Mostrar todas</option>
    <option value="Ingenieria de Software">Ingenieria de software</option>
    <option value="Diseño Gráfico Digital">Diseño Grafico Digital</option>
    <option value="Administración de empresas">Administración de empresas</option>
  </select>
  <div class="contenedor">



  <script>
    /*Imaginemos que los datos para las tarjetas vienen de una consulta */
    /*Con esta información ¿Comó las renderizamos?*/
     const alumnos = [
      {
        apellidos: "Yarleque peña",
        nombres: "Marcos Isaias",
        carrera: "Ingenieria de Software",
        telefono: "9236786152",
        correo: "marcos@gmail.com"
      },
      {

      {

      },
      {

      {

        carrera: "Administraciòn industrial",
        telefono: "929333333",
        correo: "vladi@gmail.com"
      },
     ]
     

     const contenedor =document.querySelector(".contenedor")// . = clase
     const selector = document.getElementById('selector-carreras')

     //Evento (¿Cuándo ejecutamos la instrucción?)
     selector.addEventListener("change", function(){
      renderizarTarjetas(selector.value)
     })
     //Continuamos..
     //Manejo de DOM Document Object Model
     //Esta función requiere el nombre de la carrera, en caso esté vacia, mostrar todo
     function renderizarTarjetas(carrera = ""){
       let listaFiltrada = []
      contenedor.innerHTML = ''

     /* if (carrera.trim() === "") {
        listaFiltrada = alumnos
      }else{
        listaFiltrada = alumnos.filter(a => a.carrera == carrera)
      }*/
 
      //Operador ternario
      listaFiltrada = 
      carrera.trim() === ""
      ? alumnos
      : alumnos.filter(alumno => alumno.carrera == carrera)
     //Paso 1 - Recorrer todo el arreglo
     listaFiltrada.forEach(alumno => {
     const nuevaTarjeta = `
     <div class="tarjeta">
      <h4>${alumno.apellidos} ${alumno.nombres}</h4>
      <h5>${alumno.carrera}</h5>
      <a href="${alumno.telefono}">Contacto</a>
      <a href="${alumno.correo}">Enviar correo</a>
     </div>
      `
      contenedor.innerHTML += nuevaTarjeta

     });
    }
     renderizarTarjetas()
</script>
</body>
